name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing git tag to build (e.g. v1.1.0). Image will be pushed as this tag to both registries."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  DOCKERHUB_IMAGE: izznoland/izzportfolio
  GCP_REGION: us-central1
  GCP_AR_IMAGE: us-central1-docker.pkg.dev/logical-river-432714-d3/portfolio/izzportfolio

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ inputs.version }}
            ${{ env.GCP_AR_IMAGE }}:${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
