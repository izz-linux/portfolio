name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing git tag to build (e.g. v1.1.0). Image will be pushed as this tag to both registries."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  DOCKERHUB_IMAGE: izznoland/izzportfolio
  GCP_REGION: us-central1
  GCP_AR_IMAGE: us-central1-docker.pkg.dev/logical-river-432714-d3/portfolio/izzportfolio

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ inputs.version }}
            ${{ env.GCP_AR_IMAGE }}:${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
