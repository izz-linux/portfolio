name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing image version to deploy (e.g. v1.0.1). Must already exist in Artifact Registry."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: us-central1
  GCP_AR_IMAGE: us-central1-docker.pkg.dev/logical-river-432714-d3/portfolio/izzportfolio
  CLOUD_RUN_SERVICE: portfolio

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2.7.6
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_AR_IMAGE }}:${{ inputs.version }}
